<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COMPLEXE SCOLAIRE LE TREMPLIN</title>
    <meta name="description" content="Une école d'excellence qui accompagne chaque élève vers la réussite, en cultivant le travail, la discipline, les valeurs et l'épanouissement personnel.">
    <link rel="canonical" href="https://cstremplin.com/">
    <link rel="icon" type="image/jpeg" href="https://www.cstremplin.com/favicon.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
        html,body{overflow-x:hidden;width:100%}
        body{background:#f4f6f9;display:flex;justify-content:center;padding:0;min-height:100vh}
        .page{max-width:1200px;width:100%;background:#ffffff;min-height:100vh;overflow-x:hidden}
        .top-bar{background:#0a1a2a;color:#ffffff;padding:6px 5%;font-size:0.8rem;display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap}
        .top-bar a{color:#aac4d4;text-decoration:none;margin:0 8px;transition:0.2s}
        .top-bar a:hover{color:#ffffff;transform:scale(1.1)}
        .top-bar .social-icons a{margin:0 6px;font-size:0.9rem}
        .header-main{background:#ffffff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,0.04);border-bottom:2px solid #cc3333}
        .logo{display:flex;align-items:center;gap:16px}
        .logo img{height:100px;width:auto;border-radius:12px;object-fit:contain;transition:transform 0.4s}
        .logo img:hover{transform:scale(1.05) rotate(-2deg)}
        .logo h1{font-size:2.4rem;font-weight:900;color:#0a1a2a;letter-spacing:-0.5px;text-shadow:0 2px 4px rgba(0,0,0,0.04)}
        .logo h1 span{font-weight:700;color:#cc3333}
        .nav-main{display:flex;gap:1.8rem;align-items:center;flex-wrap:wrap}
        .nav-main a{color:#1a2b3e;text-decoration:none;font-weight:600;font-size:1rem;padding:6px 0;border-bottom:3px solid transparent;transition:0.3s}
        .nav-main a:hover,.nav-main a.active{border-bottom-color:#cc3333;color:#cc3333;transform:translateY(-2px)}
        .nav-main .btn-fondateur{background:#cc3333;color:#fff;padding:8px 22px;border-radius:30px;border-bottom:none;font-weight:600;font-size:0.9rem;transition:all 0.3s}
        .nav-main .btn-fondateur:hover{background:#aa2222;transform:translateY(-2px);color:#fff;border-bottom:none}
        .hero-section{background:linear-gradient(135deg,#0a1a2a 0%,#1a3a5c 50%,#2a5f7a 100%);padding:70px 5% 60px;color:#fff;display:grid;grid-template-columns:1.2fr 0.8fr;gap:50px;align-items:center;position:relative;overflow:hidden}
        .hero-section::before{content:'';position:absolute;top:-50%;right:-20%;width:60%;height:200%;background:radial-gradient(ellipse,rgba(255,255,255,0.04) 0%,transparent 70%);pointer-events:none}
        .hero-section h2{font-size:3.2rem;font-weight:900;line-height:1.1;letter-spacing:-1px;text-shadow:0 4px 20px rgba(0,0,0,0.15)}
        .hero-section h2 i{font-weight:300;opacity:0.9}
        .hero-section p{font-size:1.15rem;line-height:1.8;margin:18px 0 28px;opacity:0.92;max-width:90%}
        .hero-section .badge-school{display:inline-block;background:rgba(255,255,255,0.12);border-radius:30px;padding:6px 20px;font-size:0.75rem;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:10px;backdrop-filter:blur(4px)}
        .hero-buttons{display:flex;flex-wrap:wrap;gap:14px}
        .btn-primary{background:#ffffff;color:#0a1a2a;padding:14px 36px;border-radius:40px;font-weight:700;font-size:1rem;text-decoration:none;transition:all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);border:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
        .btn-primary:hover{background:#f0f4f8;transform:translateY(-4px) scale(1.03);box-shadow:0 16px 40px rgba(0,0,0,0.18)}
        .btn-outline{background:transparent;color:#fff;padding:14px 36px;border-radius:40px;font-weight:600;font-size:1rem;text-decoration:none;border:1.5px solid rgba(255,255,255,0.4);transition:all 0.4s cubic-bezier(0.25,0.46,0.45,0.94);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
        .btn-outline:hover{background:rgba(255,255,255,0.08);border-color:#fff;transform:translateY(-4px) scale(1.03)}
        .hero-stats{background:rgba(255,255,255,0.08);border-radius:24px;padding:28px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.06);transition:transform 0.4s}
        .hero-stats:hover{transform:perspective(800px) rotateX(2deg) rotateY(2deg)}
        .hero-stats .stat-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
        .hero-stats .stat-row:last-child{border-bottom:0}
        .hero-stats .stat-row .label{font-weight:400;opacity:0.8;font-size:0.95rem}
        .hero-stats .stat-row .value{font-weight:700;font-size:1.05rem}
        .section-title{font-size:2rem;font-weight:800;color:#0a1a2a;letter-spacing:-0.5px;padding:48px 5% 16px 5%;display:flex;align-items:center;gap:14px}
        .section-title i{color:#cc3333;font-size:2.2rem}
        .section-sub{font-size:1.05rem;color:#4a5a6a;padding:0 5% 14px 5%;max-width:800px;line-height:1.7}
        .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:0 5% 36px 5%}
        .card{background:#f8f9fa;border-radius:24px;padding:28px;border:1px solid #eef2f5;
